<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partite Sara Thomas Alessia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#cdd8f2">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una scheda per settimana con una riga per ciascun fratello; questo weekend e il prossimo aperti, gli altri richiudibili */
/* Palette pastello: crema e blu Mandello, un pastello per fratello (Sara verde, Thomas rosso, Alessia azzurro) */
:root {
  --bg: #faf6ec;
  --surface: #fffdf8;
  --ink: #1f2a4d;
  --muted: #6a7088;
  --line: #ece3cf;
  --navy: #1c2d5e;
  --orange: #f6c08f;
  --p0: #2f7a4b; --p0-pastel: #bfe6cc; --p0-soft: #eef8f1;   /* Sara */
  --p1: #b23a3a; --p1-pastel: #f6c4c4; --p1-soft: #fdf0f0;   /* Thomas */
  --p2: #2a7aa8; --p2-pastel: #bfe3f7; --p2-soft: #eef8fd;   /* Alessia */
  --home: #cdd8f2; --home-ink: #1c2d5e; --home-tint: #f2f5fc;
  --away: #fcd7b4; --away-ink: #7a3d0c; --away-tint: #fff6ec;
  --now: #cdd8f2; --now-ink: #1c2d5e;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12182a; --surface: #1a2238; --ink: #f1ecdf; --muted: #a9b0c4; --line: #2b3552; --navy: #2a3c72; --orange: #c98a55;
    --p0: #9fdcb5; --p0-pastel: #2f5a41; --p0-soft: #1a2a24; --p1: #f3a9a9; --p1-pastel: #633233; --p1-soft: #2c1e25;
    --p2: #a6d6f2; --p2-pastel: #2d5470; --p2-soft: #18293a;
    --home: #36477a; --home-ink: #e3e9fb; --home-tint: #1c2540; --away: #7a4d28; --away-ink: #ffe3c8; --away-tint: #2a2223;
    --now: #2a3c72; --now-ink: #f1ecdf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12182a; --surface: #1a2238; --ink: #f1ecdf; --muted: #a9b0c4; --line: #2b3552; --navy: #2a3c72; --orange: #c98a55;
  --p0: #9fdcb5; --p0-pastel: #2f5a41; --p0-soft: #1a2a24; --p1: #f3a9a9; --p1-pastel: #633233; --p1-soft: #2c1e25;
  --p2: #a6d6f2; --p2-pastel: #2d5470; --p2-soft: #18293a;
  --home: #36477a; --home-ink: #e3e9fb; --home-tint: #1c2540; --away: #7a4d28; --away-ink: #ffe3c8; --away-tint: #2a2223;
  --now: #2a3c72; --now-ink: #f1ecdf;
  color-scheme: dark;
}
.c0 { --c: var(--p0); --cp: var(--p0-pastel); --cs: var(--p0-soft); }
.c1 { --c: var(--p1); --cp: var(--p1-pastel); --cs: var(--p1-soft); }
.c2 { --c: var(--p2); --cp: var(--p2-pastel); --cs: var(--p2-soft); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 17px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font: 800 2rem/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--c); }
.sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }
.club { display: flex; align-items: center; gap: 12px; }
.club img { width: 54px; height: 54px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--orange); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }
#weeks { display: grid; gap: 18px; }

.week { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.week-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.week-h b { font: 800 1.35rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.week-h span { color: var(--muted); font-size: .9rem; }
.week.now { border-color: var(--now); box-shadow: 0 2px 0 var(--orange); }
.week.now .week-h { background: var(--now); color: var(--now-ink); border-color: var(--orange); border-bottom-width: 4px; }
.week.now .week-h span { color: var(--now-ink); }
.week.now .week-h span { color: var(--now-ink); opacity: .75; }

/* ogni partita è una scheda a sé, con la fascia del colore del fratello */
.week > .who, details.week > .who { margin: 12px 12px 0; }
.week > .who:last-child, details.week > .who:last-child { margin-bottom: 12px; }
.who { display: block; border: 2px solid var(--cp); border-radius: 14px; overflow: hidden; background: var(--surface); }
.who > span { display: none; }
.who > span { background: var(--cp); }
.who-b { display: grid; min-width: 0; }
.who-b > :not(.name) { padding: 12px 14px 14px; }
.who.h .who-b > :not(.name) { background: var(--home-tint); }
.who.a .who-b > :not(.name) { background: var(--away-tint); }
.ball { width: 22px; height: 22px; flex: none; color: var(--c); display: inline-flex; align-self: center; }
.ball svg { width: 100%; height: 100%; }
.where { justify-self: start; display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 9px; border-radius: 9px; font: 800 1.1rem/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.where svg { width: 17px; height: 17px; }
.where.h { background: var(--home); color: var(--home-ink); }
.where.a { background: var(--away); color: var(--away-ink); }
.name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--cp); padding: 9px 14px; }
.name b { font: 800 1.5rem/1 var(--f-display); text-transform: uppercase; color: var(--c); }
.who > span { width: 8px; }
.name small { color: var(--c); opacity: .85; font-size: .85rem; font-weight: 600; }
.when { font-weight: 700; font-size: 1.15rem; }
.when .t { font: 800 1.35rem/1 var(--f-display); margin-left: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.place { font-size: .98rem; }
.place b { font-weight: 600; }
.vs { display: grid; gap: 1px; padding: 8px 12px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--cp); }
.vs span { color: var(--muted); font: 700 .72rem/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; }
.vs b { font: 800 1.3rem/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .02em; color: var(--ink); text-wrap: balance; }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 700 .72rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--cs); color: var(--c); }
.tag svg { width: 13px; height: 13px; }
.maps { justify-self: start; display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 10px 16px; border-radius: 12px; text-decoration: none; font: 700 1.05rem/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--c); background: var(--cp); }
.maps svg { width: 18px; height: 18px; }
.none { font: 700 1.2rem/1.2 var(--f-display); text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.played { opacity: .55; }
.played .maps { display: none; }

details.week summary { list-style: none; cursor: pointer; align-items: center; flex-wrap: nowrap; border-bottom: 0; }
details.week summary::-webkit-details-marker { display: none; }
details.week[open] summary { border-bottom: 1px solid var(--line); }
details.week .sx { display: grid; gap: 4px; min-width: 0; }
details.week .sx > b { font: 800 1.15rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--ink); }
.minis { display: grid; gap: 5px; font-size: .9rem; color: var(--ink); margin-top: 2px; }
.mini b { font-weight: 700; color: var(--c); }
.mini { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; min-width: 0; }
.mini > b { min-width: 4.4em; }
.mw { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mv { min-width: 0; color: var(--muted); }
.mv b { color: var(--ink); font-weight: 700; }
.mini i { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; margin-right: 2px; }
.mini i svg { width: 13px; height: 13px; }
.mini i.h { background: var(--home); color: var(--home-ink); } .mini i.a { background: var(--away); color: var(--away-ink); }
.mini.off { color: var(--muted); }
.chev { width: 22px; height: 22px; flex: none; color: var(--muted); transition: transform .2s; display: inline-flex; }
.chev svg { width: 100%; height: 100%; }
details[open] .chev { transform: rotate(180deg); }
summary:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.maps:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.empty { background: var(--surface); border-radius: 18px; padding: 24px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="club"><img src="assets/logo.png" alt="Logo Pol. Mandello" width="54" height="54"><div><h1 id="titolo">Sara, Thomas &amp; Alessia</h1>
    <div class="sub">Dove giocano ogni settimana · Mandello</div></div></div>
  </header>
  <div id="weeks"><div class="empty">Carico le partite…</div></div>
  <footer><span class="legend" style="justify-content:center;margin-bottom:6px"><span class="where h" style="font-size:.85rem">In casa</span><span class="where a" style="font-size:.85rem">Trasferta</span></span>Pallavolo: calendari FIPAV · Basket: calendario DR3</footer>
</main>

<!-- Per l'anteprima i dati possono essere incorporati qui; sul sito vengono letti dai file in data/ -->
<script id="dati" type="application/json"></script>
<script>
(function () {
  const GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const FINE_MIN = 150;
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const parse = s => { const [a, b] = s.split("T"); const [y, m, d] = a.split("-").map(Number); const [h, mi] = (b || "12:00").split(":").map(Number); return new Date(y, m - 1, d, h, mi); };
  const lunedi = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const chiave = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

  const icoPin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const icoHome = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>';
  const icoPlane = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15.5v-2l-8-5V3.8a1.5 1.5 0 0 0-3 0v4.7l-8 5v2l8-2.5v5l-2 1.5V21l3.5-1 3.5 1v-1.5l-2-1.5v-5z"/></svg>';
  const icoVolley = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 2.8c-1.6 3.4-1.4 6.6.2 9.2"/><path d="M12.2 12c3.2.3 6.2-.9 8.6-3.6"/><path d="M12.2 12c-1.7 2.8-4.6 4.4-8.4 4.6"/><path d="M7 4.4c3 .6 6.7 3.4 8.3 7.2 1 2.5 1 5.4.1 8.6"/></svg>';
  const icoBasket = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 2.8v18.4M2.8 12h18.4"/><path d="M5.5 5.5c2.2 1.8 3.4 4 3.4 6.5s-1.2 4.7-3.4 6.5"/><path d="M18.5 5.5c-2.2 1.8-3.4 4-3.4 6.5s1.2 4.7 3.4 6.5"/></svg>';
  const icoChev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  const norm = j => (j.partite || []).map(p => ({
    d: parse(p.inizio), riposo: !!p.riposo, oraDubbia: !!p.ora_da_confermare, casa: !!p.casa,
    avv: p.avversario, campo: p.campo, ind: p.indirizzo, q: p.cerca_maps || [p.campo, p.indirizzo].filter(Boolean).join(", ")
  }));

  function riga(per, i, p) {
    let body;
    if (!p || p.riposo) {
      body = '<div class="none">' + (p && p.riposo ? "Riposo · nessuna partita" : per.lista.length ? "Nessuna partita" : "Calendario da inserire") + '</div>';
    } else {
      const giocata = p.d.getTime() + FINE_MIN * 60000 < Date.now();
      body = '<div class="' + (giocata ? 'played' : '') + '" style="display:grid;gap:6px">' +
        '<div class="when">' + GIORNI[p.d.getDay()] + ' ' + p.d.getDate() + ' ' + MESI[p.d.getMonth()] + '<span class="t">' + (p.oraDubbia ? 'orario da confermare' : 'ore ' + pad(p.d.getHours()) + ':' + pad(p.d.getMinutes())) + '</span>' + (giocata ? ' · giocata' : '') + '</div>' +
        '<div class="place"><b>' + esc(p.campo) + '</b>' + (p.ind ? '<br>' + esc(p.ind) : '') + '</div>' +
        '<div class="where ' + (p.casa ? 'h' : 'a') + '">' + (p.casa ? icoHome + "In casa" : icoPlane + "Trasferta") + '</div>' +
        '<div class="vs"><span>contro</span><b>' + esc(p.avv) + '</b></div>' +
        (p.q ? '<a class="maps" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.q) + '" target="_blank" rel="noopener">' + icoPin + 'Google Maps</a>' : '') +
        '</div>';
    }
    const hw = p && !p.riposo ? (p.casa ? ' h' : ' a') : '';
    const ball = '<i class="ball" title="' + (per.sport === 'basket' ? 'Basket' : 'Pallavolo') + '">' + (per.sport === 'basket' ? icoBasket : icoVolley) + '</i>';
    return '<div class="who c' + i + hw + '"><span></span><div class="who-b"><div class="name">' + ball + '<b>' + esc(per.nome) + '</b><small>' + esc(per.squadra) + '</small></div>' + body + '</div></div>';
  }

  function breve(per, i, lista) {
    const p = lista.find(x => !x.riposo);
    const txt = p ? '<span class="mw">' + GIORNI[p.d.getDay()].slice(0, 3) + ' ' + p.d.getDate() + (p.oraDubbia ? '' : ' · ' + pad(p.d.getHours()) + ':' + pad(p.d.getMinutes())) + '</span><span class="mv">vs <b>' + esc(p.avv) + '</b></span>' : 'nessuna partita';
    return '<span class="mini c' + i + (p ? '' : ' off') + '">' + (p ? '<i class="' + (p.casa ? 'h' : 'a') + '" title="' + (p.casa ? 'In casa' : 'Trasferta') + '">' + (p.casa ? icoHome : icoPlane) + '</i>' : '') + '<b>' + esc(per.nome) + '</b> ' + txt + '</span>';
  }

  function render(persone) {
    const lunOggi = lunedi(new Date()).getTime();
    const sett = new Map();
    persone.forEach((per, i) => per.lista.forEach(p => {
      const l = lunedi(p.d);
      if (l.getTime() < lunOggi) return;
      const k = chiave(l);
      if (!sett.has(k)) sett.set(k, { lun: l, per: persone.map(() => []) });
      sett.get(k).per[i].push(p);
    }));
    const tutte = [...sett.values()].sort((a, b) => a.lun - b.lun);
    const box = document.getElementById("weeks");
    if (!tutte.length) { box.innerHTML = '<div class="empty">Nessuna partita in programma.</div>'; return; }
    const aperti = new Set([...box.querySelectorAll("details[open]")].map(d => d.dataset.k));

    box.innerHTML = tutte.map(w => {
      const sab = new Date(w.lun); sab.setDate(sab.getDate() + 5);
      const dom = new Date(w.lun); dom.setDate(dom.getDate() + 6);
      const diff = Math.round((w.lun.getTime() - lunOggi) / (7 * 86400000));
      const titolo = diff === 0 ? "Questa settimana" : diff === 1 ? "Settimana prossima" : "";
      const giorni = w.per.flat().map(p => p.d);
      const primo = giorni.reduce((m, d) => d < m ? d : m, giorni[0]);
      const ultimo = giorni.reduce((m, d) => d > m ? d : m, giorni[0]);
      const ini = new Date(primo.getFullYear(), primo.getMonth(), primo.getDate());
      const fin = new Date(ultimo.getFullYear(), ultimo.getMonth(), ultimo.getDate());
      const date = ini.getTime() === fin.getTime() ? GIORNI[ini.getDay()] + " " + ini.getDate() + " " + MESI[ini.getMonth()]
        : ini.getMonth() === fin.getMonth() ? ini.getDate() + "–" + fin.getDate() + " " + MESI[fin.getMonth()]
        : ini.getDate() + " " + MESI[ini.getMonth()] + " – " + fin.getDate() + " " + MESI[fin.getMonth()];
      const righe = persone.map((per, i) => (w.per[i].length ? w.per[i] : [null]).map(p => riga(per, i, p)).join("")).join("");
      if (diff <= 1) return '<section class="week' + (diff === 0 ? ' now' : '') + '"><div class="week-h"><b>' + titolo + '</b><span>' + date + '</span></div>' + righe + '</section>';
      const k = chiave(w.lun);
      return '<details class="week" data-k="' + k + '"' + (aperti.has(k) ? ' open' : '') + '><summary class="week-h"><span class="sx"><b>' + date + '</b><span class="minis">' +
        persone.map((per, i) => breve(per, i, w.per[i])).join("") + '</span></span><i class="chev">' + icoChev + '</i></summary>' + righe + '</details>';
    }).join("");
  }

  async function avvia() {
    const box = document.getElementById("weeks");
    try {
      const inline = document.getElementById("dati").textContent.trim();
      let conf, dati;
      if (inline) {
        ({ conf, dati } = JSON.parse(inline));
      } else {
        conf = await fetch("data/persone.json", { cache: "no-store" }).then(r => r.json());
        dati = await Promise.all(conf.persone.map(p => fetch(p.file + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({ partite: [] }))));
      }
      const persone = conf.persone.map((p, i) => ({ nome: p.nome, squadra: p.squadra, sport: p.sport, lista: norm(dati[i]) }));
      const nomi = persone.map((p, i) => '<span class="c' + i + '">' + esc(p.nome) + '</span>');
      document.getElementById("titolo").innerHTML = nomi.slice(0, -1).join(", ") + " &amp; " + nomi[nomi.length - 1];
      render(persone);
      setInterval(() => render(persone), 300000);
    } catch (e) {
      box.innerHTML = '<div class="empty">Non riesco a leggere i calendari. Riprova tra poco.</div>';
    }
  }
  avvia();
})();
</script>
</body>
</html>
